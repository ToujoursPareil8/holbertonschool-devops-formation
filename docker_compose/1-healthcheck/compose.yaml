services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - "./web:/usr/share/nginx/html"
    depends_on:
      - api

  api:
    build: ./api/
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
  
  db:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s