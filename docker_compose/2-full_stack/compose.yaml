services:

  reverse_proxy:
    image: nginx:alpine
    ports:
        - "8080:80"
    volumes:
        - "./reverse_proxy/nginx.conf:/etc/nginx/nginx.conf:ro"
    depends_on:
      - web
      - api
  web:
    image: nginx:alpine
    volumes:
      - "./web:/usr/share/nginx/html"


  api:
    build: ./api/
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
  
  db:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  cache:
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s